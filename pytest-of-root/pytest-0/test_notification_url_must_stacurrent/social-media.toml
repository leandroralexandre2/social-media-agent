post_fill_settle_seconds = 2
[platforms.x]
enabled = true
notifications_url = "https://evil.example/notifications"
search_terms = ["Acme"]
[platforms.linkedin]
enabled = true
notifications_url = "https://www.linkedin.com/notifications/"
search_terms = []
[persona]
description = "Friendly and concise"
languages = ["en"]
forbidden_topics = ["legal promises"]
[safety]
auto_publish = false
