# Plow-init owns the model route and injects the `plow` MCP server, including
# the Mac/browser capabilities. This file keeps only agent-owned behaviour.
agent:
  verify_on_stop: false

cron:
  mirror_delivery: true

group_sessions_per_user: false

plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      allow_tool_override: false

platforms:
  plow_chat:
    enabled: true

