name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q
      - run: python -m compileall -q bin
      - run: bash -n scripts/*.sh
      - name: Validate Compose
        run: |
          cp plow-credentials.example plow-credentials
          docker compose config --quiet
      - run: docker build --platform linux/amd64 -t social-media-agent:test .
